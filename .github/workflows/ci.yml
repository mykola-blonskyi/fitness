name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend lint:check

  backend-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend format:check

  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec tsc --noEmit

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend test
      # The current e2e spec only exercises the @Public() `/` route, so it
      # needs no real Postgres yet. Once a real integration-test seam lands
      # (a spec's Testing Decisions - see docs/decisions.md), this step
      # gains a docker-compose-backed Postgres, matching the todolist
      # project's pretest:e2e/posttest:e2e pattern.
      - run: pnpm --filter backend test:e2e

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend check:i18n

  frontend-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend format:check

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # .next/types isn't generated on a fresh checkout (next build/dev
      # creates it) - tsconfig's ".next/types/**/*.ts" include glob simply
      # matches nothing, no need to run a build first just to populate it.
      - run: pnpm --filter frontend exec tsc --noEmit

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend test

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # MediaPipe/OpenCV shared libs - same ones the worker Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -r worker/requirements-dev.txt
      - run: python -m pytest worker/tests

  frontend-lighthouse-pwa:
    # FITNESS-12 acceptance criteria: "Lighthouse PWA-installability checks
    # pass in CI". Lighthouse 10 dropped the PWA category (and its
    # installable-manifest/service-worker/maskable-icon audits) out of
    # core - lighthouse@9 is pinned as a frontend devDependency
    # specifically to keep running these checks (see
    # frontend/scripts/check-pwa-installability.mjs). Targets /en/health,
    # the one route that needs neither a live Hub session nor a backend
    # (see frontend/src/proxy.ts) - the manifest/icons/service-worker
    # registration it checks live in the root layout, so any route would
    # prove the same thing. ubuntu-latest ships Chrome preinstalled, which
    # chrome-launcher auto-detects, so no separate browser setup step.
    runs-on: ubuntu-latest
    # Dummy values, not real secrets. `next build` needs them as much as the
    # server does: it evaluates /api/auth/[...nextauth] to collect page data,
    # and auth.ts reads OIDC_ISSUER/OIDC_CLIENT_SECRET at module scope.
    env:
      OIDC_ISSUER: http://localhost:1
      OIDC_CLIENT_SECRET: ci-placeholder
      APP_URL: http://localhost:3000
      BACKEND_URL: http://localhost:1
      AUTH_SECRET: ci-placeholder
      HUB_URL: http://localhost:1
      SENTRY_RELEASE: ci-release-marker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend build
      - name: Start frontend server
        run: pnpm --filter frontend start &
      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/en/health > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time" >&2
          exit 1
      - name: Assert the health page reports the release
        # Proves the marker the deploy gate polls for actually renders, here
        # rather than on the one deploy where a silent 'unknown' would strand it.
        run: |
          live=$(curl --silent --fail http://localhost:3000/en/health \
            | tr '>' '\n' | grep 'name="release"' | grep -oE 'ci-release-marker')
          [ "$live" = "ci-release-marker" ]
      - run: pnpm --filter frontend lighthouse:pwa
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pwa-report
          path: frontend/lighthouse-pwa-report.json
          if-no-files-found: ignore

  deploy:
    # Only after every check above is green, and only for real pushes to
    # main (never PRs). Coolify itself builds the images from
    # docker-compose.yml; this job just tells it to, then the backend
    # container's own entrypoint runs the migration before serving traffic
    # (see backend/Dockerfile) - a failed migration means the new
    # container never becomes healthy, so Coolify leaves the previous one
    # running rather than cutting over.
    needs:
      - backend-lint
      - backend-format
      - backend-typecheck
      - backend-test
      - worker-test
      - frontend-lint
      - frontend-format
      - frontend-typecheck
      - frontend-test
      - frontend-lighthouse-pwa
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        # Coolify's /deploy route rejects GET (it answers with a "use POST
        # instead" handler), despite what some of its own docs show.
        run: |
          curl --fail --show-error --silent --request POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}"

      - name: Wait for the release to be live
        # A 2xx from the webhook only means Coolify accepted the request, not
        # that the new containers ever cut over - without this, a deploy that
        # dies after the image build leaves main drifting under a green tick.
        timeout-minutes: 26
        run: |
          # Deadline rather than an iteration count, so the loop always ends
          # inside timeout-minutes and the error below is what CI reports.
          deadline=$(( $(date +%s) + 1500 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            live=$(curl --silent --fail --max-time 15 https://fitness.blonskyi.dev/en/health \
              | tr '>' '\n' | grep 'name="release"' \
              | grep -oE '[0-9a-f]{40}|unknown' | head -1) || true
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "fitness.blonskyi.dev is serving ${{ github.sha }}"
              exit 0
            fi
            sleep 20
          done
          echo "::error::fitness.blonskyi.dev still serves '${live:-nothing}', expected ${{ github.sha }}. \
          Check the Coolify deployment log and the VPS disk; 'unknown' means Coolify's \
          \"Include Source Commit in Build\" toggle is off."
          exit 1
