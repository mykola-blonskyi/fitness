# Coolify deployment (see docs/decisions.md ADR-005, docs/architecture.md).
#
# No `networks:` block on purpose - Coolify manages one network per stack
# itself, and a custom network here causes Traefik container-IP issues (see
# Coolify's own docker-compose guidance). To reach the shared VPS Postgres
# instance, enable this stack's "Connect to Predefined Network" toggle in
# the Coolify UI.
#
# Every ${VAR} below is supplied by Coolify's own per-resource environment
# variable panel at deploy time - never a committed .env file. See
# backend/.env.example, frontend/.env.example, and worker/.env.example for
# what each one means. WORKER_MINIO_ACCESS_KEY/WORKER_MINIO_SECRET_KEY are
# deliberately separate Coolify variables from the backend's MINIO_* pair -
# see knowledge/business-rules.md "Python worker accesses MinIO directly,
# not via presigned URLs".

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SENTRY_DSN: ${SENTRY_DSN}
      USDA_API_KEY: ${USDA_API_KEY}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # Literal, not ${REDIS_URL}: Coolify also runs its own `coolify-redis`
      # (password-protected) aliased `redis` on the shared network, so the
      # bare hostname `redis` round-robins between the two. `photo-queue-redis`
      # is unambiguous. Drop the REDIS_URL var from Coolify's env panel.
      REDIS_URL: redis://photo-queue-redis:6379
      PORT: 3001
    restart: unless-stopped
    # No ports/domain: stays private on Coolify's network (ADR-001 - the
    # backend is internal-only). The frontend reaches it at
    # http://backend:3001 over that network.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # See the backend service's REDIS_URL note.
      REDIS_URL: redis://photo-queue-redis:6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${WORKER_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${WORKER_MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: unless-stopped
    # Internal-only, same as backend - no ports/domain (docs/architecture.md
    # "Photo Analysis Worker").
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 or exit(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Named photo-queue-redis, not redis: Coolify attaches every service to
  # its shared proxy network, where `coolify-redis` already answers to
  # `redis` - a bare `redis` hostname resolves to either one at random.
  photo-queue-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cross-language photo-analysis job queue (ADR-003) - no persistence
    # needed, a lost stub job can just be re-uploaded.
    # Without a healthcheck, Docker reports no Health status at all for
    # this container, which Coolify's status aggregator treats as
    # "unknown" and rolls up to the whole app - even when every other
    # service is healthy.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # SOURCE_COMMIT only populates when Coolify's "Include Source Commit
      # in Build" is enabled (see backend service and docs/decisions.md
      # ADR-006) - same toggle governs both services' release tag.
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_PROJECT}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        SENTRY_RELEASE: ${SOURCE_COMMIT}
    environment:
      API_URL: ${API_URL}
      APP_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      PROJECT_SLUG: ${PROJECT_SLUG}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      BACKEND_URL: http://backend:3001
      DEV_BYPASS_AUTH: 'false'
    depends_on:
      - backend
    restart: unless-stopped
    # Public domain is assigned via Coolify's own per-service domain config,
    # not declared here - Coolify's proxy picks up the Dockerfile's EXPOSE.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/en/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
